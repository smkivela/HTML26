<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS osa 2 harjoitus 2</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

<form class="form-group">

    <label for="nimi">Nimi:</label>
    <input type="text" id="nimi" name="nimi" required>

    <label for="email">Sähköposti:</label>
    <input type="email" id="email" name="email" required>

    <label for="salasana">Salasana:</label>
    <input type="password" id="salasana" name="salasana" required>

    <label for="ika">Ikä:</label>
    <input type="number" id="ika" name="ika">

    <label for="viesti">Viesti:</label>
    <textarea id="viesti" name="viesti"></textarea>

    <label>
        <input type="checkbox" name="ehdot">
        Hyväksyn ehdot
    </label>

    <button type="submit">Lähetä</button>

</form>
    
</body>
</html>
