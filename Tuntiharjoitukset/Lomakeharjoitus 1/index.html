<body>


    <!-- LÄHETÄ SÄHKÖPOSTIA LOMAKE -->
    
    <form>
        
        <h2>Lähetä sähköpostia</h2>

    <label for="nimi">Nimi:</label>
    <input type="text" id="nimi" name="nimi" required>

    <label for="sähköposti">Sähköposti:</label>
    <input type="email" id="sähköposti" name="sähköposti" placeholder="matti@example.com" required>

    <label for="aihe">Aihe:</label>
    <input type="text" id="aihe" name="aihe" required>

    <label for="viesti">Viesti:</label>
    <textarea id="viesti" name="viesti" required>Kirjoita viestisi</textarea>

    <button type="submit">Lähetä</button>






</form>

<!-- REKISTERÖIDY LOMAKE -->

<form>



    <h2>Rekisteröidy</h2>

    <label for="käyttäjänimi">Käyttäjänimi*</label>
    <input type="text" id="käyttäjänimi" name="käyttäjänimi" required>

     <label for="sähköposti">Sähköposti*</label>
    <input type="email" id="sähköposti" name="sähköposti" required>

     <label for="salasana">Salasana*</label>
    <input type="password" id="salasana" name="salasana" minlength="7" required>

     <label for="vahvistus">Salasanan vahvistus*</label>
    <input type="password" id="vahvistus" name="vahvistus" minlength="7" required>

     <label for="syntymäpäivä">Syntymäpäivä</label>
    <input type="date" id="syntymäpäivä" name="syntymäpäivä">

<fieldset>
 <legend>Käyttöehdot</legend>



 <label for="käyttöehdot">Hyväksyn käyttöehdot*</label>
 <input type="checkbox" id="käyttöehdot" name="käyttöehdot" checked></input>
 
</fieldset>
 
    <button type="submit">Rekisteröidy</button>

    <p id="pakko"><em>*Tähdellä merkityt kentät ovat pakollisia.</em></p>


</form>
