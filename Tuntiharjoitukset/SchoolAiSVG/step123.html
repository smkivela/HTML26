<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vektoriharjoitukset 1, 2 ja 3.</title>
</head>
<body>

    <svg width="400" height="200">
    <polygon points="1,150 150,50 250,150" fill="red"/>
    </svg>
    
    <svg width="200" height="150" viewBox="0 0 200 150">  
    <rect x="1" y="90" width="100" height="60" fill="green"/>  
    </svg> 
    
    <svg width="200" height="200" viewBox="0 0 400 400">  
    <circle cx="200" cy="200" r="200" fill="black"/>  
    </svg> 

    <svg width="300" height="200" viewBox="0 0 300 200">  
    <ellipse cx="150" cy="100" rx="150" ry="20" fill="yellow"/>  
    </svg>  

    <svg width="300" height="200" viewBox="0 0 300 200">  
    <line x1="1" y1="1" x2="250" y2="150" stroke="purple" stroke-width="9"/>  
    </svg> 

    <svg width="300" height="200" viewBox="0 0 300 200">  
    <polyline points="100,100 100,50 150,150 200,50 202,150" stroke="blue" stroke-width="1" fill="gray"/>  
    </svg>  

    <svg width="300" height="200" viewBox="0 0 300 200">
    <circle cx="150" cy="100" r="80" fill="orange"/>
    <circle cx="150" cy="80" r="20" fill="white"/>
    <polygon points="95,45 105,37 115,29 125,23 135,25 130,32 120,38 110,47 100,58" fill="white" opacity="0.7"/>
    <text x="150" y="87" font-size="23" text-anchor="middle" fill="black" font-family="arial">9</text>
    </svg>



</body>
</html>
