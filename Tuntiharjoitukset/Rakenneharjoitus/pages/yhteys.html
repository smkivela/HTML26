<!-- LOMAKE -->

    <form>

        <fieldset>
            <legend>Lähetä minulle sähköpostia tällä lomakkeella</legend>

            <fieldset>
                <legend>Miten voin auttaa?</legend>

                <label>
                    <input type="checkbox" name="asia" value="aanisuunnittelu">
                    Äänisuunnittelu
                </label>

                <label>
                    <input type="checkbox" name="asia" value="musiikkituotanto">
                    Musiikkituotanto
                </label>

                <label>
                    <input type="checkbox" name="asia" value="ohjelmointi">
                    Ohjelmointi
                </label>
            </fieldset>

            <label for="nimi">Nimi</label>
            <input type="text" name="nimi" id="nimi">


            <fieldset>

                <legend>Onko asiasi kiireellinen?</legend>
                    <label for="yes">Kyllä</label>
                    <input type="radio" name="kiire" id="yes">

                    <label for="no">Ei</label>
                    <input type="radio" name="kiire" id="no" checked>
            </fieldset>

            <label for="aihe">Aihe:</label>
            <input type="text" id="aihe" name="aihe" required>

            <label for="sahkoposti">Sähköposti:</label>
            <input type="email" id="sahkoposti" name="sahkoposti" required placeholder="esimerkki@example.com">

            <label for="puhelin">Puhelinnumero:</label>
            <input type="tel" id="puhelin" name="puhelin" value="+358">

            <label for="viesti">Viesti:</label> 
            <textarea id="viesti" name="viesti" rows="6" required></textarea>

            <button id="lähetä"  type="submit">Lähetä viesti</button>

        </fieldset>

    </form>
