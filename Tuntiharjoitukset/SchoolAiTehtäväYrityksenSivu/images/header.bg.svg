<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">

    <rect width="1600" height="500" fill="#060322"/>

    <!-- waveform -->
    <path
        d="M0 280
           C80 280 80 210 160 210
           S240 350 320 350
           S400 180 480 180
           S560 310 640 310
           S720 140 800 140
           S880 330 960 330
           S1040 190 1120 190
           S1200 300 1280 300
           S1360 160 1440 160
           S1520 280 1600 280"
        fill="none"
        stroke="#555"
        stroke-width="2"
        opacity="0.7"
    />

    <!-- signal lines -->
    <path
        d="M120 80 C300 180 420 60 600 150
           S900 260 1080 120
           S1350 70 1500 170"
        fill="none"
        stroke="#444"
        stroke-width="1"
    />

    <path
        d="M50 400 C250 300 380 430 580 340
           S900 250 1100 370
           S1400 430 1600 330"
        fill="none"
        stroke="#444"
        stroke-width="1"
    />

    <!-- nodes -->
    <circle cx="320" cy="350" r="6" fill="#888"/>
    <circle cx="640" cy="310" r="6" fill="#888"/>
    <circle cx="800" cy="140" r="6" fill="#888"/>
    <circle cx="1120" cy="190" r="6" fill="#888"/>
    <circle cx="1440" cy="160" r="6" fill="#888"/>

    <!-- connecting lines -->
    <line x1="320" y1="350" x2="640" y2="310"
          stroke="#555" stroke-width="1"/>

    <line x1="640" y1="310" x2="800" y2="140"
          stroke="#555" stroke-width="1"/>

    <line x1="800" y1="140" x2="1120" y2="190"
          stroke="#555" stroke-width="1"/>

    <line x1="1120" y1="190" x2="1440" y2="160"
          stroke="#555" stroke-width="1"/>

</svg>