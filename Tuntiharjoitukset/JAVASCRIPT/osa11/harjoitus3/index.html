<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script> 
</head>
<body>
    

    <form id="lomake">
        <label for="subject">Aihe:</label>
        <select id="subject" name="subject" required>
            <option value="">Valitse aihe</option>
            <option value="kysymys">Kysymys</option>
            <option value="palaute">Palaute</option>
            <option value="muuta">Muu</option>
        </select><br><br>

        <label for="message">Viesti:</label>
        <textarea id="message" name="message" required minlength="10" maxlength="500"></textarea><br><br>

        <label>Arvosana:</label>
        <input type="radio" id="rating1" name="rating" value="1" required>
        <label for="rating1">1</label>
        <input type="radio" id="rating2" name="rating" value="2">
        <label for="rating2">2</label>
        <input type="radio" id="rating3" name="rating" value="3">
        <label for="rating3">3</label>
        <input type="radio" id="rating4" name="rating" value="4">
        <label for="rating4">4</label>
        <input type="radio" id="rating5" name="rating" value="5">
        <label for="rating5">5</label><br><br>

        <label for="contact">Haluatko yhteydenoton:</label>
        <input type="checkbox" id="contact" name="contact"><br><br>

        <input type="submit" value="Lähetä">
    </form>

        <h2>Yhteenveto</h2>
        <p id="yhteenveto"></p>



</body>
</html>
