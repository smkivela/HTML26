<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>

        
</head>
<body>


   


    <form>
        <label for="username">Käyttäjänimi:</label>
        <input type="text" id="username" name="username" required minlength="2" maxlength="20"><br><br>

        <label for="email">Sähköposti:</label>
        <input type="email" id="email" name="email" required minlength="5" maxlength="50"><br><br>

        <label for="password">Salasana:</label>
        <input type="password" id="password" name="password" required minlength="8" maxlength="50"><br><br>

        <label for="terms">Hyväksyn ehdot:</label>
        <input type="checkbox" id="terms" name="terms" required><br><br>

        <input type="submit" value="Lähetä">
    </form>
    
</body>
</html>
